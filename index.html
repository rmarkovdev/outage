<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Світло 2.2</title>
<meta name="description" content="Графік погодинних відключень для вашої черги, Полтавська область">
<meta name="theme-color" content="#EDEFF3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Світло">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- Модулі підтягуються паралельно, а не ланцюжком імпортів -->
<link rel="modulepreload" href="js/config.js">
<link rel="modulepreload" href="js/time.js">
<link rel="modulepreload" href="js/schedule.js">
<link rel="modulepreload" href="js/favs.js">
<link rel="modulepreload" href="js/state.js">
<link rel="modulepreload" href="js/data.js">
<link rel="modulepreload" href="js/dial.js">
<link rel="modulepreload" href="js/view.js">
<link rel="modulepreload" href="js/gestures.js">
</head>
<body data-state="none">
<main>
  <header>
    <label class="who">
      <b>Черга <span id="group">2.2</span></b>
      <small>Полтавська область</small>
      <select id="picker" aria-label="Обрати чергу"></select>
    </label>
    <button id="refresh" type="button" aria-label="Оновити графік">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
    </button>
  </header>
  <nav id="quick" class="quick" aria-label="Збережені черги"></nav>

  <div class="clock">
    <svg id="dial" viewBox="0 0 320 320" role="img" aria-label="Графік на сьогодні, 24 години"></svg>
    <div class="center" aria-live="polite">
      <h1 id="title">Завантаження…</h1>
      <p id="sub"></p>
      <p id="when"></p>
    </div>
  </div>
  <div class="legend" aria-hidden="true">
    <span><i class="l-on"></i>світло є</span>
    <span><i class="l-off"></i>немає</span>
  </div>
  <p id="cmp-note" class="cmp-note" hidden></p>

  <fieldset id="list-mode" class="seg-ctl" hidden>
    <legend>Показувати у списку</legend>
    <label><input type="radio" name="list-mode" value="off" checked><span>Коли немає світла</span></label>
    <label><input type="radio" name="list-mode" value="on"><span>Коли світло є</span></label>
  </fieldset>

  <div id="days"></div>

  <button id="compare" type="button" class="compare" hidden></button>

  <footer>
    <p id="meta"></p>
    <p>Аварійні відключення тут не показуються. Офіційне джерело:
      <a href="https://www.poe.pl.ua/disconnection/power-outages/" target="_blank" rel="noopener">poe.pl.ua</a>.
      Дані: <a href="https://github.com/yaroslav2901/OE_OUTAGE_DATA" target="_blank" rel="noopener">OE_OUTAGE_DATA</a>.</p>
    <p id="version"></p>
  </footer>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>

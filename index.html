<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Світло 2.2</title>
<meta name="description" content="Графік погодинних відключень для вашої черги, Полтавська область">
<meta name="theme-color" content="#EDEFF3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Світло">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --lamp: #F2B92B;        /* нитка розжарювання */
    --lamp-soft: #F7D777;
    --night: #18213B;       /* вимкнене світло */
    --paper: #EDEFF3;
    --ink: #1D2433;
    --slate: #5B6680;

    --bg: var(--paper);
    --fg: var(--ink);
    --muted: var(--slate);
    --seg-on: var(--lamp);
    --seg-off: #C5CBD8;
    --seg-none: #DADFE8;
    --hand: var(--ink);
    --line: rgba(29, 36, 51, .12);
    --display: 'Unbounded', -apple-system, 'Segoe UI', sans-serif;
    --text: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body[data-state="off"] {
    --bg: var(--night);
    --fg: #E9EDF5;
    --muted: #97A2BC;
    --seg-off: #2E3A5E;
    --seg-none: #263152;
    --hand: #E9EDF5;
    --line: rgba(233, 237, 245, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1E2536;
      --fg: #E9EDF5;
      --muted: #97A2BC;
      --seg-off: #39445F;
      --seg-none: #2C3549;
      --hand: #E9EDF5;
      --line: rgba(233, 237, 245, .12);
    }
    body[data-state="off"] { --bg: #0E1427; --seg-off: #26304D; --seg-none: #1C2440; }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    background: var(--bg); color: var(--fg);
    font: 16px/1.45 var(--text);
    transition: background-color .6s ease, color .6s ease;
    padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 440px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .who { position: relative; }
  .who b { font: 600 20px/1.2 var(--display); letter-spacing: -.01em; }
  .who b::after { content: ''; display: inline-block; width: 7px; height: 7px; margin-left: 8px;
    border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: translateY(-4px) rotate(45deg); opacity: .6; }
  .who small { display: block; color: var(--muted); font-size: 13px; }
  .who select { position: absolute; inset: 0; opacity: 0; font-size: 16px; width: 100%; }
  .who:focus-within b { outline: 2px solid var(--lamp); outline-offset: 4px; border-radius: 4px; }

  #refresh { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--fg);
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
  #refresh:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
  #refresh svg { width: 18px; height: 18px; }
  #refresh.spin svg { animation: spin .6s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .clock { position: relative; width: min(100%, 340px); margin: 18px auto 6px; aspect-ratio: 1; }
  #dial { width: 100%; height: 100%; display: block; overflow: visible; }
  .seg { transition: fill .4s ease; }
  .seg.on { fill: var(--seg-on); }
  .seg.off { fill: var(--seg-off); }
  .seg.maybe { fill: url(#hatch); }
  .seg.none { fill: var(--seg-none); }
  .tick { fill: var(--muted); font: 600 11px var(--display); text-anchor: middle; dominant-baseline: central; }
  .hand { stroke: var(--hand); stroke-width: 2.5; stroke-linecap: round; }
  .hand-dot { fill: var(--hand); }

  .center { position: absolute; inset: 24%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; }
  #title { margin: 0; font: 700 clamp(22px, 7vw, 28px)/1.1 var(--display); letter-spacing: -.02em; text-wrap: balance; }
  body[data-state="on"] #title { color: var(--fg); }
  #sub { margin: 8px 0 0; font-size: 15px; color: var(--muted); }
  #when { margin: 4px 0 0; font: 600 15px var(--display); font-variant-numeric: tabular-nums; }
  body[data-state="on"] #when { color: #B07D00; }
  body[data-state="off"] #when, body[data-state="maybe"] #when { color: var(--lamp-soft); }
  @media (prefers-color-scheme: dark) { body[data-state="on"] #when { color: var(--lamp); } }

  .legend { display: flex; justify-content: center; gap: 16px; font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .legend .l-on { background: var(--seg-on); }
  .legend .l-off { background: var(--seg-off); }
  .legend .l-maybe { background: repeating-linear-gradient(45deg, var(--lamp) 0 2px, var(--seg-off) 2px 4px); }

  .seg-ctl { display: flex; gap: 4px; margin: 8px 0 12px; padding: 3px; border: 1px solid var(--line);
    border-radius: 12px; }
  .seg-ctl[hidden] { display: none; }
  .seg-ctl legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .seg-ctl label { flex: 1; position: relative; }
  .seg-ctl input { position: absolute; opacity: 0; inset: 0; margin: 0; }
  .seg-ctl span { display: block; text-align: center; padding: 8px 6px; border-radius: 9px;
    font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; transition: background-color .2s, color .2s; }
  .seg-ctl input:checked + span { background: var(--fg); color: var(--bg); }
  .seg-ctl input:focus-visible + span { outline: 2px solid var(--lamp); outline-offset: 2px; }
  .day li.on { border-left-color: var(--lamp); }

  .day { border-top: 1px solid var(--line); padding: 14px 0 6px; }
  .day h2 { margin: 0 0 8px; font: 600 15px/1.3 var(--text); display: flex; justify-content: space-between; gap: 8px; }
  .day .total { font-weight: 400; color: var(--muted); }
  .day ul { list-style: none; margin: 0; padding: 0; }
  .day li { display: flex; justify-content: space-between; align-items: baseline;
    padding: 9px 0 9px 14px; border-left: 3px solid var(--seg-off); margin-bottom: 6px; }
  .day li.maybe { border-left-style: dashed; border-left-color: var(--lamp); }
  .range { font: 600 18px var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .len { color: var(--muted); font-size: 14px; }
  .free { margin: 0; font-weight: 600; color: #B07D00; }
  body[data-state="off"] .free { color: var(--lamp-soft); }
  .muted { margin: 0; color: var(--muted); }

  footer { margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.5; }
  footer p { margin: 0 0 4px; }
  footer a { color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    body, .seg { transition: none; }
    #refresh.spin svg { animation: none; }
  }
</style>
</head>
<body data-state="none">
<main>
  <header>
    <label class="who">
      <b>Черга <span id="group">2.2</span></b>
      <small>Полтавська область</small>
      <select id="picker" aria-label="Обрати чергу"></select>
    </label>
    <button id="refresh" type="button" aria-label="Оновити графік">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
    </button>
  </header>

  <div class="clock">
    <svg id="dial" viewBox="0 0 320 320" role="img" aria-label="Графік на сьогодні, 24 години"></svg>
    <div class="center" aria-live="polite">
      <h1 id="title">Завантаження…</h1>
      <p id="sub"></p>
      <p id="when"></p>
    </div>
  </div>
  <div class="legend" aria-hidden="true">
    <span><i class="l-on"></i>світло є</span>
    <span><i class="l-off"></i>немає</span>
  </div>

  <fieldset id="list-mode" class="seg-ctl" hidden>
    <legend>Показувати у списку</legend>
    <label><input type="radio" name="list-mode" value="off" checked><span>Коли немає світла</span></label>
    <label><input type="radio" name="list-mode" value="on"><span>Коли світло є</span></label>
  </fieldset>

  <div id="days"></div>

  <footer>
    <p id="meta"></p>
    <p>Аварійні відключення тут не показуються. Офіційне джерело:
      <a href="https://www.poe.pl.ua/disconnection/power-outages/" target="_blank" rel="noopener">poe.pl.ua</a>.
      Дані: <a href="https://github.com/yaroslav2901/OE_OUTAGE_DATA" target="_blank" rel="noopener">OE_OUTAGE_DATA</a>.</p>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>

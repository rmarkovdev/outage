<body data-state="none">
<main>
  <header>
    <label class="who">
      <b>Черга <span id="group">2.2</span></b>
      <small>Полтавська область</small>
      <select id="picker" aria-label="Обрати чергу"></select>
    </label>
    <button id="refresh" type="button" aria-label="Оновити графік">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
    </button>
  </header>
  <nav id="quick" class="quick" aria-label="Збережені черги"></nav>

  <div class="clock">
    <svg id="dial" viewBox="0 0 320 320" role="img" aria-label="Графік на сьогодні, 24 години"></svg>
    <div class="center" aria-live="polite">
      <h1 id="title">Завантаження…</h1>
      <p id="sub"></p>
      <p id="when"></p>
    </div>
  </div>
  <div class="legend" aria-hidden="true">
    <span><i class="l-on"></i>світло є</span>
    <span><i class="l-off"></i>немає</span>
  </div>
  <p id="cmp-note" class="cmp-note" hidden></p>

  <fieldset id="list-mode" class="seg-ctl" hidden>
    <legend>Показувати у списку</legend>
    <label><input type="radio" name="list-mode" value="off" checked><span>Коли немає світла</span></label>
    <label><input type="radio" name="list-mode" value="on"><span>Коли світло є</span></label>
  </fieldset>

  <div id="days"></div>

  <button id="compare" type="button" class="compare" hidden></button>

  <footer>
    <p id="meta"></p>
    <p>Аварійні відключення тут не показуються. Офіційне джерело:
      <a href="https://www.poe.pl.ua/disconnection/power-outages/" target="_blank" rel="noopener">poe.pl.ua</a>.
      Дані: <a href="https://github.com/yaroslav2901/OE_OUTAGE_DATA" target="_blank" rel="noopener">OE_OUTAGE_DATA</a>.</p>
    <p id="version"></p>
  </footer>
</main>
